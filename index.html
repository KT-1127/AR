<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR動作テスト</title>
<style>
  html,body{margin:0;height:100%;background:#1b1b1b;overflow:hidden}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#1b1b1b}
  #c{position:fixed;inset:0;width:100%;height:100%}
  #log,#stat{position:fixed;left:0;right:0;padding:8px 10px;background:rgba(0,0,0,.78);
    color:#7CFC9A;font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap;z-index:9}
  #log{top:0;max-height:45%;overflow:auto}
  #stat{bottom:0;color:#FFD98A}
  #go{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;
    padding:18px 34px;font-size:17px;border:0;border-radius:999px;background:#fff}
</style>
</head>
<body>

<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="log"></div>
<div id="stat">まだ開始していません</div>
<button id="go">テスト開始</button>

<script>
var L=document.getElementById('log'), S=document.getElementById('stat');
function log(m){ L.textContent += m + '\n'; }
window.onerror = function(m,s,l,c){ log('■ ERR ' + m + ' @' + l + ':' + c); };
addEventListener('unhandledrejection', function(e){ log('■ REJ ' + e.reason); });

log('1) https(secure) = ' + window.isSecureContext);
log('2) getUserMedia  = ' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
log('3) iframe内       = ' + (window.self !== window.top));

var v=document.getElementById('v'), c=document.getElementById('c'), g=c.getContext('2d');
var a=0, gotOrient=false;
function fit(){ c.width=innerWidth; c.height=innerHeight; }
addEventListener('resize', fit); fit();

document.getElementById('go').onclick = async function(){
  this.remove();

  // ── 動きセンサー（iOSはタップ直後に呼ぶ必要あり）
  var D = window.DeviceOrientationEvent;
  if(D && typeof D.requestPermission === 'function'){
    try{ log('4) 動きセンサー許可 = ' + await D.requestPermission()); }
    catch(e){ log('4) 動きセンサー ERR ' + e); }
  } else {
    log('4) 動きセンサー = 許可不要 or 非対応(' + !!D + ')');
  }
  addEventListener('deviceorientation', function(e){
    if(e.alpha===null && e.beta===null) return;
    a = e.alpha || 0; gotOrient = true;
  });

  // ── カメラ
  try{
    var st = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:'environment' } }, audio:false });
    v.srcObject = st;
    await v.play();
    log('5) カメラ = OK');
  }catch(e){
    log('5) カメラ ERR ' + e.name + ' : ' + e.message);
  }

  setInterval(function(){
    S.textContent = '映像 ' + v.videoWidth + '×' + v.videoHeight +
      '  readyState=' + v.readyState +
      '\nセンサー ' + (gotOrient ? ('OK alpha=' + Math.round(a) + '°') : '受信なし');
  }, 500);

  loop();
};

function loop(){
  g.clearRect(0,0,c.width,c.height);
  g.save();
  g.translate(c.width/2, c.height/2);
  g.rotate(-a * Math.PI/180);
  g.fillStyle = 'rgba(255,70,70,.85)';
  g.fillRect(-70,-70,140,140);
  g.fillStyle = '#fff';
  g.fillRect(-6,-96,12,26);
  g.restore();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
